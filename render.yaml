# Render 설정 (Blueprint). 비밀 값은 Render 화면에서 직접 입력합니다.
services:
  - type: web
    name: ai-wep-server
    runtime: python
    plan: free
    region: singapore
    rootDir: server
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.8
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SECRET_KEY
        sync: false
      - key: ROBOFLOW_API_KEY
        sync: false
